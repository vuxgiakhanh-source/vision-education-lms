# MẪU, CHƯA CHẠY THỬ trên VPS thật. Đổi lms.example.com, đường dẫn chứng chỉ và đường dẫn tệp đề.
# Kiểm cú pháp trước khi nạp:  sudo nginx -t

upstream lms_api { server 127.0.0.1:8000; keepalive 32; }
upstream lms_web { server 127.0.0.1:5173; keepalive 16; }

server {
    listen 80;
    server_name lms.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name lms.example.com;

    ssl_certificate     /etc/letsencrypt/live/lms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.example.com/privkey.pem;

    # Tải tệp đề lên (giáo viên). Tệp phát cho học sinh nên nhỏ hơn nhiều (xem kế hoạch phòng thi).
    client_max_body_size 55m;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API: /api/login -> FastAPI /login. Dấu / cuối proxy_pass bỏ tiền tố /api.
    # Build frontend với NEXT_PUBLIC_API_URL=https://lms.example.com/api
    location /api/ {
        proxy_pass http://lms_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Tệp đề: FastAPI kiểm quyền rồi trả header "X-Accel-Redirect: /protected-exams/<tên tệp>".
    # Nginx tự gửi tệp, tiến trình Python không phải giữ kết nối trong lúc truyền 2 MB x 500 em.
    # "internal" nghĩa là trình duyệt gọi thẳng đường dẫn này sẽ nhận 404.
    location /protected-exams/ {
        internal;
        alias /var/lib/lms/exam-files/;
        add_header Cache-Control "private, no-store";
    }

    # Tài nguyên tĩnh của Next có tên băm nội dung nên cache vô thời hạn được.
    location /_next/static/ {
        proxy_pass http://lms_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://lms_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cố ý KHÔNG đặt limit_req theo IP cho /api/login: cả trung tâm dùng chung một IP Wi-Fi,
    # giới hạn theo IP sẽ chặn nhầm cả lớp. Giới hạn theo tài khoản đã nằm trong backend.
}
