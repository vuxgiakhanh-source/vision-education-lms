limit_req_zone $binary_remote_addr zone=lab_api:10m rate=100r/s;
log_format lab '$request_id $request_method $status $request_time';
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log lab;
  client_max_body_size 32k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    limit_req zone=lab_api burst=100 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
