# Template: copy to .github/workflows/course-lab.yml in YOUR LEARNING REPO.
# Paths below assume this workshop is the root of that learning repo.
name: learning-lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r deploy/requirements.txt
      - run: python -m unittest discover -s . -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run build
        working-directory: frontend
# Pin reviewed action commit SHAs and container digests for a release workflow.
# This template does not deploy or use product secrets.
