            </div>

            <div class="bg-white rounded-[22px] border border-[#EAEFF5] shadow-[0_4px_20px_rgba(20,25,45,0.03)] p-3.5">
              <button type="button" class="w-full h-[52px] rounded-[16px] bg-gradient-to-r from-[#4543D0] via-[#4A48D6] to-[#3432B0] hover:from-[#3D3BC4] hover:to-[#2C2AA0] text-white font-semibold text-[14.5px] px-4 flex items-center justify-between shadow-[0_8px_20px_rgba(69,67,208,0.28)] transition-all cursor-pointer whitespace-nowrap">
                <span class="flex items-center gap-2.5 whitespace-nowrap">
                  <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
                  <span>Đổi lịch học</span>
                </span>
                <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script>
    let selectedDayId = 't3'
    let weekNumber = 9

    const weekDays = [
      { id: 't2', label: 'T2', date: '09/11' },
      { id: 't3', label: 'T3', date: '10/11' },
      { id: 't4', label: 'T4', date: '11/11' },
      { id: 't5', label: 'T5', date: '12/11' },
      { id: 't6', label: 'T6', date: '13/11' },
      { id: 't7', label: 'T7', date: '14/11' },
      { id: 'cn', label: 'CN', date: '15/11' },
    ]

    const shifts = [
      {
        id: 'morning',
        label: 'Ca 1 · Sáng',
        timeRange: '07:30 – 10:30',
        bgClass: 'bg-[#EAF2FF]',
        iconDesktop: '<svg class="w-6 h-6 lg:w-7 lg:h-7 mb-0.5 shrink-0" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 6V8.5M9.5 8.8L11.2 10.5M22.5 8.8L20.8 10.5M5.8 15H8.3M23.7 15H26.2" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M10.5 19C10.5 15.962 12.962 13.5 16 13.5C19.038 13.5 21.5 15.962 21.5 19H10.5Z" fill="#3B82F6"/><path d="M6.5 20.5H25.5" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round"/><path d="M10 24.5H22" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round"/></svg>',
        iconMobile: '<svg class="w-6 h-6 shrink-0" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 6V8.5M9.5 8.8L11.2 10.5M22.5 8.8L20.8 10.5M5.8 15H8.3M23.7 15H26.2" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M10.5 19C10.5 15.962 12.962 13.5 16 13.5C19.038 13.5 21.5 15.962 21.5 19H10.5Z" fill="#3B82F6"/><path d="M6.5 20.5H25.5" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round"/><path d="M10 24.5H22" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round"/></svg>',
      },
      {
        id: 'afternoon',
        label: 'Ca 2 · Chiều',
        timeRange: '14:00 – 17:00',
        bgClass: 'bg-[#FFF3E6]',
        iconDesktop: '<svg class="w-6 h-6 lg:w-7 lg:h-7 mb-0.5 shrink-0" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="5.5" fill="#F59E0B"/><path d="M16 5.5V8M16 24V26.5M5.5 16H8M24 16H26.5M8.6 8.6L10.4 10.4M21.6 21.6L23.4 23.4M23.4 8.6L21.6 10.4M10.4 21.6L8.6 23.4" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/></svg>',
        iconMobile: '<svg class="w-6 h-6 shrink-0" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="5.5" fill="#F59E0B"/><path d="M16 5.5V8M16 24V26.5M5.5 16H8M24 16H26.5M8.6 8.6L10.4 10.4M21.6 21.6L23.4 23.4M23.4 8.6L21.6 10.4M10.4 21.6L8.6 23.4" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/></svg>',
      },
      {
        id: 'evening',
        label: 'Ca 3 · Tối',
        timeRange: '18:00 – 21:00',
        bgClass: 'bg-[#ECECFE]',
        iconDesktop: '<svg class="w-6 h-6 lg:w-7 lg:h-7 mb-0.5 shrink-0" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M22.8 20.3C21.5 20.9 20 21.2 18.5 21.2C13.1 21.2 8.8 16.9 8.8 11.5C8.8 9.8 9.2 8.2 10 6.8C7.1 8.3 5.2 11.3 5.2 14.7C5.2 19.7 9.3 23.8 14.3 23.8C18 23.8 21.2 21.6 22.6 18.4C22.7 19 22.8 19.7 22.8 20.3Z" fill="#E0E2FE" stroke="#5553E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        iconMobile: '<svg class="w-6 h-6 shrink-0" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M22.8 20.3C21.5 20.9 20 21.2 18.5 21.2C13.1 21.2 8.8 16.9 8.8 11.5C8.8 9.8 9.2 8.2 10 6.8C7.1 8.3 5.2 11.3 5.2 14.7C5.2 19.7 9.3 23.8 14.3 23.8C18 23.8 21.2 21.6 22.6 18.4C22.7 19 22.8 19.7 22.8 20.3Z" fill="#E0E2FE" stroke="#5553E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      },
    ]

    const sessions = [
      { dayId: 't3', shiftId: 'morning', type: 'mine', tone: 'lavender', line1: 'Hàm số', line2: 'bậc hai' },
      { dayId: 'cn', shiftId: 'morning', type: 'same-lesson', tone: 'lavender', line1: 'Hàm số', line2: 'bậc hai' },
      { dayId: 't7', shiftId: 'afternoon', type: 'same-lesson', tone: 'amber', line1: 'Hàm số', line2: 'bậc hai' },
      { dayId: 't5', shiftId: 'evening', type: 'same-lesson', tone: 'mint', line1: 'Hàm số', line2: 'bậc hai' },
    ]

    const toneStyles = {
      lavender: { card: 'bg-[#ECEBFC] hover:bg-[#E4E2FA]', badge: 'bg-[#D8D6F8] text-[#4B47B5]' },
      amber: { card: 'bg-[#FFF4E5] hover:bg-[#FDEBD2]', badge: 'bg-[#FDE6C4] text-[#B46914]' },
      mint: { card: 'bg-[#ECFAF0] hover:bg-[#DFF5E6]', badge: 'bg-[#CEEFD8] text-[#1D7A43]' },
    }

    function renderDesktopGrid() {
      const grid = document.getElementById('schedule-grid')
      const cells = []

      cells.push('<div class="rounded-2xl bg-[#F3F5FA]"></div>')

      weekDays.forEach((day) => {
        const isSelected = day.id === selectedDayId
        cells.push(`
          <button type="button" data-day="${day.id}" class="day-btn rounded-2xl flex flex-col items-center justify-center transition-all cursor-pointer ${
            isSelected
              ? 'bg-gradient-to-b from-[#4543D4] to-[#312FB5] text-white shadow-[0_6px_16px_rgba(69,67,212,0.28)]'
              : 'bg-[#F3F5FA] text-[#1E293B] hover:bg-[#EAEFF8]'
          }">
            <span class="text-[13.5px] lg:text-[14px] font-bold leading-tight">${day.label}</span>
            <span class="text-[12px] font-medium leading-tight mt-0.5 ${isSelected ? 'text-white/90' : 'text-slate-500'}">${day.date}</span>
          </button>
        `)
      })

      shifts.forEach((shift) => {
        cells.push(`
          <div class="rounded-2xl p-2 lg:p-3 flex flex-col items-center justify-center text-center gap-1 ${shift.bgClass}">
            ${shift.iconDesktop}
            <span class="text-[12px] lg:text-[13px] font-bold text-[#1E293B] leading-snug whitespace-nowrap">${shift.label}</span>
            <span class="text-[12px] font-medium text-slate-600 leading-tight whitespace-nowrap">${shift.timeRange}</span>
          </div>
        `)

        weekDays.forEach((day) => {
          const session = sessions.find((s) => s.dayId === day.id && s.shiftId === shift.id)
          if (!session) {
            cells.push('<div class="rounded-2xl bg-[#F5F6FB]"></div>')
          } else if (session.type === 'mine') {
            cells.push(`
              <button type="button" data-day="${day.id}" class="day-btn rounded-2xl bg-[#EAE9FC] border-[1.5px] border-[#3E3C8E] px-1 pt-3.5 pb-2 flex flex-col items-center justify-start gap-2.5 lg:gap-3 text-center shadow-[0_2px_10px_rgba(85,83,230,0.08)] cursor-pointer transition-transform hover:-translate-y-0.5 min-w-0">
                <span class="inline-flex items-center gap-1 px-1.5 lg:px-2 py-1 rounded-full bg-[#4341CC] text-white text-[12px] font-semibold leading-none whitespace-nowrap max-w-full">
                  <svg class="w-2.5 h-2.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                  <span class="truncate">Ca của bạn</span>
                </span>
                <span class="text-[12.5px] lg:text-[13.5px] font-semibold text-[#1E293B] leading-snug">
                  <span class="block">${session.line1}</span>
                  <span class="block">${session.line2}</span>
                </span>
              </button>
            `)
          } else {
            const style = toneStyles[session.tone]
            cells.push(`
              <button type="button" data-day="${day.id}" class="day-btn rounded-2xl px-1.5 pt-3.5 pb-2 flex flex-col items-center justify-start gap-2.5 lg:gap-3 text-center cursor-pointer transition-all hover:-translate-y-0.5 min-w-0 ${style.card}">
                <span class="inline-flex items-center px-2 lg:px-2.5 py-1 rounded-full text-[12px] font-semibold leading-none whitespace-nowrap ${style.badge}">Cùng bài</span>
                <span class="text-[12.5px] lg:text-[13.5px] font-semibold text-[#1E293B] leading-snug">
                  <span class="block">${session.line1}</span>
                  <span class="block">${session.line2}</span>
                </span>
              </button>
            `)
          }
        })
      })

      grid.innerHTML = cells.join('')
    }

    function renderMobileView() {
      const container = document.getElementById('mobile-schedule')
      const dayButtons = weekDays.map((day) => {
        const isSelected = day.id === selectedDayId
        return `
          <button type="button" data-day="${day.id}" class="day-btn py-2 rounded-xl flex flex-col items-center justify-center transition-all cursor-pointer ${
            isSelected
              ? 'bg-gradient-to-b from-[#4543D4] to-[#312FB5] text-white shadow-[0_4px_12px_rgba(69,67,212,0.28)]'
              : 'bg-[#F3F5FA] text-[#1E293B] hover:bg-[#EAEFF8]'
          }">
            <span class="text-[12px] font-bold leading-tight">${day.label}</span>
            <span class="text-[12px] font-medium leading-tight mt-0.5 ${isSelected ? 'text-white/90' : 'text-slate-500'}">${day.date}</span>
          </button>
        `
      }).join('')

      const shiftCards = shifts.map((shift) => {
        const session = sessions.find((s) => s.dayId === selectedDayId && s.shiftId === shift.id)
        let rightContent = '<span class="text-[12px] font-medium text-slate-400 pr-2">Không có buổi học</span>'

        if (session && session.type === 'mine') {
          rightContent = `
            <div class="flex-1 min-w-0 rounded-xl bg-[#EAE9FC] border-[1.5px] border-[#3E3C8E] px-3 py-2 flex items-center justify-between gap-2">
              <span class="text-[13px] font-semibold text-[#1E293B] truncate">${session.line1} ${session.line2}</span>
              <span class="inline-flex items-center gap-1 px-2 py-1 rounded-full bg-[#4341CC] text-white text-[12px] font-semibold leading-none whitespace-nowrap shrink-0">
                <svg class="w-2.5 h-2.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                Ca của bạn
              </span>
            </div>
          `
        } else if (session) {
          const style = toneStyles[session.tone]
          rightContent = `
            <div class="flex-1 min-w-0 rounded-xl px-3 py-2 flex items-center justify-between gap-2 ${style.card}">
              <span class="text-[13px] font-semibold text-[#1E293B] truncate">${session.line1} ${session.line2}</span>
              <span class="inline-flex items-center px-2 py-1 rounded-full text-[12px] font-semibold leading-none whitespace-nowrap shrink-0 ${style.badge}">Cùng bài</span>
            </div>
          `
        }

        return `
          <div class="rounded-2xl bg-[#F5F6FB] p-3 flex items-center justify-between gap-3">
            <div class="rounded-xl px-3 py-2.5 flex items-center gap-2.5 shrink-0 ${shift.bgClass}">
              ${shift.iconMobile}
              <div>
                <div class="text-[12.5px] font-bold text-[#1E293B] leading-tight">${shift.label}</div>
                <div class="text-[12px] font-medium text-slate-600 mt-0.5">${shift.timeRange}</div>
              </div>
            </div>
            ${rightContent}
          </div>
        `
      }).join('')

      container.innerHTML = `
        <div class="grid grid-cols-7 gap-1">${dayButtons}</div>
        <div class="space-y-2.5">${shiftCards}</div>
      `
    }

    function renderAll() {
      renderDesktopGrid()
      renderMobileView()
      document.querySelectorAll('.day-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          selectedDayId = btn.dataset.day
          renderAll()
        })
      })
    }

    const drawer = document.getElementById('mobile-drawer')
    document.getElementById('open-menu-btn').addEventListener('click', () => drawer.classList.remove('hidden'))
    document.getElementById('close-menu-btn').addEventListener('click', () => drawer.classList.add('hidden'))
    document.getElementById('drawer-backdrop').addEventListener('click', () => drawer.classList.add('hidden'))
    document.querySelectorAll('.drawer-nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => drawer.classList.add('hidden'))
    })

    document.getElementById('prev-week').addEventListener('click', () => {
      weekNumber = Math.max(1, weekNumber - 1)
      document.getElementById('week-label').textContent = `Tuần ${weekNumber} · 09 – 15/11/2026`
    })

    document.getElementById('next-week').addEventListener('click', () => {
      weekNumber += 1
      document.getElementById('week-label').textContent = `Tuần ${weekNumber} · 09 – 15/11/2026`
    })

    renderAll()
  </script>
</body>
</html>
